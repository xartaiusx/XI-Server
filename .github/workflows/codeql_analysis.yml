# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: CodeQL Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # At 12:00 every day.
    - cron:  '0 12 * * *'
  # Or by request
  workflow_dispatch:
    inputs:
      baseline_workflow_sha:
        description: Exact independently reviewed temporary baseline workflow commit
        required: false
        type: string
      baseline_runner_image:
        description: Exact previously observed ubuntu-26.04 runner image version
        required: false
        type: string
        default: '20261101.186.1'
      probe_recipient_der:
        description: Base64 DER recipient certificate bound by SHA-256
        required: false
        type: string
      probe_recipient_sha:
        description: SHA-256 of the reviewed public recipient
        required: false
        type: string

jobs:
  analyze:
    if: >-
      github.ref != 'refs/heads/mochi/codeql-n8a34-baseline' &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'mochi/codeql-n8a34-baseline')
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: none
          - language: python
            build-mode: none
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common cmake ninja-build libmariadb-dev-compat libluajit-5.1-dev libzmq3-dev zlib1g-dev libssl-dev binutils-dev libzstd-dev libdwarf-dev

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        trap-caching: false
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        config-file: ./.github/codeql/codeql-config.yml
        
    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    # - name: Autobuild
    #   uses: github/codeql-action/autobuild@v4

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines. 
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    - if: matrix.build-mode == 'manual'
      name: Configure and Build
      run: |
        cmake -G Ninja -S . -B build
        cmake --build build -j4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        # https://josh-ops.com/posts/github-codeql-ignore-files/
        upload: false # disable the upload here - we will upload in a different action
        output: sarif-results

    - name: Filter SARIF
      uses: zbazztian/filter-sarif@30183a0a595e8a890f1624ebba3788ce5b58711b # master as of 2022-07-26
      with:
        patterns: |
          -ext/**/*
          -build/**/*
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif

  selected_extraction_probe:
    name: Selected C++ extraction (${{ matrix.probe.name }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mochi/codeql-n8a34-baseline'
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        probe:
          - name: accepted
            commit: 8a34d1baaeded1665ef8101eba2cf2190d3d83f3
            tree: 922c92a7a2ff848d3c9d442ba55fcdb21f546db7
          - name: candidate
            commit: 3218a0586fafbbf852f63799ece6cb8f5a4dbbe5
            tree: ebf1f3656931d37c6952d4d0df114b8c0abc80eb
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ACCEPTED_N: ${{ matrix.probe.commit }}
      ACCEPTED_TREE: ${{ matrix.probe.tree }}
      EXPECTED_WORKFLOW: ${{ inputs.baseline_workflow_sha }}
      EXPECTED_IMAGE: ${{ inputs.baseline_runner_image }}

    steps:
      - name: Verify the exact authorized dispatch
        env:
          ACTUAL_WORKFLOW: ${{ github.workflow_sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          STAGE: ${{ runner.temp }}/n8a34-codeql
          RECIPIENT_DER: ${{ inputs.probe_recipient_der }}
          RECIPIENT_SHA: ${{ inputs.probe_recipient_sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == xartaiusx/XI-Server ]]
          [[ "$GITHUB_ACTOR" == xartaiusx && "$TRIGGERING_ACTOR" == xartaiusx ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_SHA" == "$ACTUAL_WORKFLOW" ]]
          [[ "$EXPECTED_WORKFLOW" =~ ^[0-9a-f]{40}$ && "$ACTUAL_WORKFLOW" == "$EXPECTED_WORKFLOW" ]]
          [[ "$EXPECTED_IMAGE" =~ ^[0-9]{8}[.][0-9]+[.][0-9]+$ && "$ImageVersion" == "$EXPECTED_IMAGE" ]]
          [[ "$STAGE" == "$RUNNER_TEMP/n8a34-codeql" && "$STAGE" =~ ^/[A-Za-z0-9_./-]+/n8a34-codeql$ ]]
          mkdir -- "$STAGE"
          mkdir -- "$STAGE/artifact" "$STAGE/tool" "$STAGE/public"
          [[ "$RECIPIENT_DER" =~ ^[A-Za-z0-9+/=]{300,4000}$ && "$RECIPIENT_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s' "$RECIPIENT_DER" | /usr/bin/base64 --decode > "$STAGE/recipient.der"
          printf '%s  %s\n' "$RECIPIENT_SHA" "$STAGE/recipient.der" | sha256sum --check --status
          [[ "$(/usr/bin/openssl version)" == 'OpenSSL 3.5.5 '* ]]
          /usr/bin/openssl x509 -inform DER -in "$STAGE/recipient.der" -out "$STAGE/recipient.pem"
          /usr/bin/openssl x509 -in "$STAGE/recipient.pem" -noout -checkend 0
          printf 'STAGE=%s\n' "$STAGE" >> "$GITHUB_ENV"

      - name: Checkout exact diagnostic revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.ACCEPTED_N }}
          persist-credentials: false

      - name: Install the compiled workflow dependencies
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$ACCEPTED_N" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "$ACCEPTED_TREE" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            binutils-dev clang-22 cmake g++ libclang-rt-22-dev libdwarf-dev \
            libluajit-5.1-dev libmariadb-dev-compat libssl-dev libzmq3-dev \
            libzstd-dev llvm-22-dev ninja-build zlib1g-dev
          [[ "$(/usr/bin/clang-22 --version | sed -n '1p')" == *'clang version 22.1.2 '* ]]
          [[ "$(/usr/bin/clang++-22 --version | sed -n '1p')" == *'clang version 22.1.2 '* ]]
          [[ "$(pkg-config --modversion libdwarf)" == 1.11.1 ]]

      - name: Setup exact codegen Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'

      - name: Preflight and seed verified public inputs
        run: |
          set -euo pipefail
          umask 077
          [[ "$(python -IB -c 'import platform; print(platform.python_version())')" == 3.14.10 ]]
          python -m venv "$STAGE/venv"
          "$STAGE/venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --no-deps \
            MarkupSafe==3.0.4 attrs==26.1.0 jinja2==3.1.6 jsonschema==4.26.0 \
            jsonschema-specifications==2025.9.1 referencing==0.37.0 rpds-py==2026.9.1 ruamel.yaml==0.19.1
          "$STAGE/venv/bin/python" -m pip check

          fetch_release() {
            local output="$1" bytes="$2" sha="$3" url
            shift 3
            for url in "$@"; do
              if (
                ulimit -f "$(( (bytes + 1023) / 1024 + 1 ))" || exit 1
                curl --disable --silent --fail --location --proto '=https' --proto-redir '=https' \
                  --connect-timeout 15 --max-time 180 --max-filesize "$bytes" \
                  --header 'Accept: application/octet-stream' --output "$output.part" "$url" 2>/dev/null
              ) && [[ "$(stat -c %s "$output.part")" == "$bytes" ]] &&
                printf '%s  %s\n' "$sha" "$output.part" | sha256sum --check --status; then
                mv -- "$output.part" "$output"
                return
              fi
              rm -f -- "$output.part"
            done
            return 1
          }

          fetch_release "$STAGE/codeql.tar.zst" 165322927 \
            eea5a76ed6778892278a387c4362fef8d03e5a9c3795f5d5022d496fccfd5388 \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-cpp-linux64.tar.zst \
            'https://api.github.com/repos/github/codeql-action/releases/assets/692238580?download=1'
          "$STAGE/venv/bin/python" -IB - "$STAGE" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          stage = Path(sys.argv[1])
          with tarfile.open(stage / "codeql.tar.zst", "r:zst") as archive:
              members = archive.getmembers()
              assert len(members) == 7806
              names = [PurePosixPath(member.name) for member in members]
              assert len(names) == len(set(names))
              assert all(path.parts[:1] == ("codeql",) and ".." not in path.parts for path in names)
              archive.extractall(stage / "tool", members=members, filter="data")
          PY

          mkdir -p -- .cpm-cache/cpm
          fetch_release .cpm-cache/cpm/CPM_0.40.2.cmake 41017 \
            c8cdc32c03816538ce22781ed72964dc864b2a34a310d3b7104812a5ca2d835d \
            https://github.com/cpm-cmake/CPM.cmake/releases/download/v0.40.2/CPM.cmake \
            'https://api.github.com/repos/cpm-cmake/CPM.cmake/releases/assets/183458005?download=1'

          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          while read -r name upstream key commit tree pin; do
            dir=".cpm-cache/$name/$key"
            refspec="$commit"
            if [[ "$pin" != "$commit" ]]; then
              refspec="refs/tags/$pin:refs/tags/$pin"
            fi
            git init -q "$dir"
            timeout -k 5s 90s git -C "$dir" -c protocol.allow=never \
              -c protocol.https.allow=always -c http.followRedirects=false \
              fetch --quiet --depth=1 "https://github.com/$upstream.git" "$refspec"
            [[ "$(git -C "$dir" rev-parse "$pin^{commit}")" == "$commit" ]]
            git -C "$dir" -c core.hooksPath=/dev/null checkout -q --detach "$commit"
            [[ "$(git -C "$dir" rev-parse HEAD^{tree})" == "$tree" ]]
            [[ -z "$(git -C "$dir" status --porcelain --untracked-files=all)" ]]
          done <<'DEPENDENCIES'
          argparse p-ranav/argparse 9cea4917b2970c78de6877229edae62480f088e8 d924b84eba1f0f0adf38b20b7b4829f6f65b6570 9e01c35c0be6707afc4001ae23c5c3f6df2b9449 d924b84eba1f0f0adf38b20b7b4829f6f65b6570
          asio chriskohlhoff/asio 213145964e945b838d29d274e090666d1151b845 03cf5f86a780dd102f1cdd3a59d1244d12143e46 16ddf21945b41cf41421bea65e8ce00cdf3e58ed asio-1-38-0
          bcrypt zach2good/libbcrypt 7ac6b4178d22a0c3d5fffae21ac54ea887d2b81f ac197c7b0bd26b6a90ee2ed9be7b12eb5a9e7455 d47d573522d2c0465a7ae5a1bb285e301e6c9118 ac197c7b0bd26b6a90ee2ed9be7b12eb5a9e7455
          catch2 catchorg/Catch2 1b2c19d23bca710b0cab412b221d18c1a5b6e30e fa43b77429ba76c462b1898d6cd2f2d7a9416b14 fa9c5c76ec061bd603214810100c8642613e8dd3 v3.7.1
          cpp-httplib yhirose/cpp-httplib e90c13aa23c631b40c8587878372d866fc6ddad6 2132205e1a69c9fce8096f085b1b8d72efc759fa 5e6a6dab2c9399cc4fcf9ca70497e888098626a1 v0.49.0
          cpptrace jeremy-rifkin/cpptrace a5a22a200360d708c9fd79def3ac89ae920fb99a 3db8da80111171c219ab5839905771386bee06b3 bd5ba6c37b663c59ee7e7c82f93efccebbb5de83 v1.0.4
          earcut_hpp mapbox/earcut.hpp 664f1589ab4303bd8df5ae62893abb77a159097b 4811a2b69b91f6127a75e780de6e2113609ddabb 038388da065d5aaeeac209d812ec1c8538d94b9c v2.2.4
          efsw SpartanJ/efsw 4a1acfb1094c03deaa2dfb6c14e5228b87fade3a 22f17a0bcdf3a4edf61f8b14328391463389e548 a818dee680d127d607a09011dca7d00e0d4a7487 22f17a0bcdf3a4edf61f8b14328391463389e548
          expected-lite martinmoene/expected-lite bddbd6cec2a355865273eb290041d6a85eb5443d 48e5e2294689eac07fc5ae6784355941e9add475 129fdc3c6aee06882565bc7b6d79b90fce2caf42 48e5e2294689eac07fc5ae6784355941e9add475
          fast_obj thisistherk/fast_obj 0fd9e24f3928a4488a541074267752d263d5f4d0 8145eb0a942784e5491a2e6b50008ce0fe3aa203 b00537e33339281acb92fcb8bad5ef24d204cc68 8145eb0a942784e5491a2e6b50008ce0fe3aa203
          fmt fmtlib/fmt 73a722f8f578c3e3b457c0bc68c23aaa9e9e7516 1be298e1bd68957e4cd352e1f676f00e07dcfb57 efdc46099ef7eaefde5fd7b439f1d65cfc02214e 12.2.0
          function2 Naios/function2 2f8d3306a75857a2cba44d5ebcd7c0d9fc9c0a48 a354bd093d2b6e50c9325dbce84d20b4e77aabc6 0028c4d834b4b6f7f38cb42be47d26fc019bf0c4 4.2.4
          glaze stephenberry/glaze d3de1ad79eff6374ccc03d590b11c83e1581fcd3 d78832c82289c61a9315bfbc35332cec9f4e93ca ed68eafbb64c13bd56570676dae85939bdf13344 v9.0.0
          json nlohmann/json b88ca108e0b5a597e859a21658d11fa5f1feb410 55f93686c01528224f448c19128836e7df245f72 1eb780542e829bf1615828ed0d5f407497bbce7b v3.12.0
          magic_enum Neargye/magic_enum ecc8253cdc9c5a1fdd2fd470aa5bb147fe79b51a 1384769c66bd16ec9bb1353f45fe8ec8ccc12dbd f7216e993dca41a362615cc651612b0bddefc074 v0.9.8
          pcg-cpp imneme/pcg-cpp 7561d718805487e2397ee23ff00d83a7169f8410 428802d1a5634f96bcd0705fab379ff0113bcf13 7a5a84e572844d46114acce0cc825deb2f8df9b3 428802d1a5634f96bcd0705fab379ff0113bcf13
          recastnavigation recastnavigation/recastnavigation 1fe579ca38080d77ad4dcbb1b569aeb042f78694 1078bfe346d9bb560faa748c8fde2e7aae73a3ab 8f0a30b61cc97e3ba342b9e757bb03b6a8778fd5 1078bfe346d9bb560faa748c8fde2e7aae73a3ab
          spdlog gabime/spdlog 7d8f0a52a5940a6c3bda30de759b878ace4af6d1 79524ddd08a4ec981b7fea76afd08ee05f83755d 84cb8d8db0bfa07bbab5623e90799c4ea776c197 v1.17.0
          termcolor ikalnytskyi/termcolor 32234b984804180e5880f4ad6e1a24dca188a1c0 89f20096bef51de347ec6f99345f65147359bd7c 37a69232d541e95ff21253e5c903a6b29c9202e3 89f20096bef51de347ec6f99345f65147359bd7c
          unordered_dense martinus/unordered_dense e16a31eaaa67d1cfd8446bf3385bc3b4361a52c8 3234af2c03549bc85656bfd3a86993bf1cd8aef1 40f25261cffbae5c901319dd76013224ff3658dd v4.8.1
          utfcpp nemtrif/utfcpp e9bb58070612c29564d71568d5df52a47c3867f6 f9319195dfddf369f68f18e7c0039b3f351797fd 8a11d3b2db0b53548f79c84d9b64430be803bf34 v4.0.8
          zlib madler/zlib b5e2c7ec5e8efcfba2a4eb6b6a8c3bd7f8619522 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf 16b86ef85c591c244523c98c71508be7908d1189 v1.3.1
          DEPENDENCIES

      - name: Trace the four compiler invocations offline
        run: |
          set -euo pipefail
          umask 077
          codeql="$STAGE/tool/codeql/codeql"
          printf '%s  %s\n' 74a276b81502c0bb9052e7002962f6abfe7c263c17a940bb6d761b0d11ee7189 .github/codeql/codeql-config.yml | sha256sum --check --status
          "$codeql" version --format=json > "$STAGE/artifact/codeql-version.json"
          "$STAGE/venv/bin/python" -IB -c \
            'import json, sys; assert json.load(open(sys.argv[1]))["version"] == "2.27.4"' \
            "$STAGE/artifact/codeql-version.json"
          [[ -d modules && ! -L modules && -f modules/init.txt && ! -L modules/init.txt && ! -x modules/init.txt ]]
          [[ "$(git ls-tree "$ACCEPTED_N" -- modules/init.txt)" == $'100644 blob 9ac1a648fd11a4dd845a0c1c4f421bdf170d82ff\tmodules/init.txt' ]]
          [[ "$(git cat-file -s 9ac1a648fd11a4dd845a0c1c4f421bdf170d82ff)" == 1575 && "$(wc -c < modules/init.txt)" == 1625 ]]
          printf '%s  %s\n' 67a7c230142954d5ae565795700ac808a9493926333c9122da8240b5bb77131b modules/init.txt | sha256sum --check --status
          git diff --cached --quiet --ignore-submodules=none "$ACCEPTED_N" --
          git ls-files -v | awk '/^[a-zS] / { hidden = 1 } END { exit hidden }'
          printf '%s\n' custom era/lua example > modules/init.txt
          [[ "$(wc -c < modules/init.txt)" == 23 ]]
          printf '%s  %s\n' 4142943d38594680549dc2dadae36b6f705d92377668fe39274f1cab1eacd767 modules/init.txt | sha256sum --check --status
          [[ "$(git diff --name-only --no-renames --ignore-submodules=none "$ACCEPTED_N" --)" == modules/init.txt ]]
          export TRACE_ROOT="$GITHUB_WORKSPACE" TRACE_PY="$STAGE/venv/bin/python"
          cat > "$STAGE/trace.sh" <<'TRACE'
          #!/usr/bin/bash
          set -euo pipefail
          export CC=/usr/bin/clang-22 CXX=/usr/bin/clang++-22 PYTHONDONTWRITEBYTECODE=1
          export CPM_SOURCE_CACHE="$TRACE_ROOT/.cpm-cache"
          /usr/bin/cmake -G Ninja -S "$TRACE_ROOT" -B "$TRACE_ROOT/build" --fresh \
            -DCMAKE_BUILD_TYPE=Debug -DTRACY_ENABLE=OFF -DPCH_ENABLE=OFF \
            -DCMAKE_C_FLAGS_DEBUG:STRING=-g0 -DCMAKE_CXX_FLAGS_DEBUG:STRING=-g0 \
            -DCPM_SOURCE_CACHE:PATH="$CPM_SOURCE_CACHE" -DSTAGE_BINARIES=OFF \
            -DPython_EXECUTABLE="$TRACE_PY" -DCACHE_BINARY:FILEPATH= \
            -DCMAKE_C_COMPILER_LAUNCHER:FILEPATH= -DCMAKE_CXX_COMPILER_LAUNCHER:FILEPATH= \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DXI_LUA_ENUM_OUTPUT_DIR:PATH="$TRACE_ROOT/build/probe-lua-enums" \
            -DXI_SCHEMA_OUTPUT_DIR:PATH="$TRACE_ROOT/build/probe-schemas"
          cd -- "$TRACE_ROOT"
          "$TRACE_PY" -IB -m tools.codegen "$TRACE_ROOT/build" \
            --lua-enum-output-dir "$TRACE_ROOT/build/probe-lua-enums" \
            --schema-output-dir "$TRACE_ROOT/build/probe-schemas"
          [[ -s "$TRACE_ROOT/build/generated/.enum_codegen.stamp" ]]
          TRACE
          chmod 700 -- "$STAGE/trace.sh"

          tool_cache=$(/usr/bin/realpath -e -- "$RUNNER_TOOL_CACHE")
          python_home=$(/usr/bin/realpath -e -- "$pythonLocation")
          [[ "$tool_cache" =~ ^/[A-Za-z0-9_./-]+$ && "$python_home" == "$tool_cache/Python/3.14.10/x64" ]]
          python_lib=$(/usr/bin/realpath -e -- "$python_home/lib")
          base_python=$(/usr/bin/realpath -e -- "$python_home/bin/python3.14")
          [[ "$python_lib" == "$python_home/lib" && "$base_python" == "$python_home/bin/"* ]]
          [[ "$(/usr/bin/realpath -e -- "$TRACE_PY")" == "$base_python" ]]

          offline=(sudo --non-interactive /usr/bin/unshare --net -- /usr/bin/setpriv \
            --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$HOME" \
            LD_LIBRARY_PATH="$python_lib" TRACE_ROOT="$TRACE_ROOT" TRACE_PY="$TRACE_PY")
          "${offline[@]}" "$TRACE_PY" -IB - "$python_home" "$STAGE/venv" <<'PY'
          from pathlib import Path
          import platform
          import sys

          import jinja2
          import jsonschema
          from ruamel.yaml import YAML

          assert platform.python_version() == "3.14.10"
          assert Path(sys.base_prefix).resolve() == Path(sys.argv[1])
          assert Path(sys.prefix).resolve() == Path(sys.argv[2])
          PY
          configure_exit=0
          "${offline[@]}" /usr/bin/bash "$STAGE/trace.sh" > "$STAGE/artifact/configure.log" 2>&1 || configure_exit=$?
          printf 'Diagnostic configure exit %d\n' "$configure_exit"
          [[ "$(git rev-parse HEAD)" == "$ACCEPTED_N" && "$(git rev-parse HEAD^{tree})" == "$ACCEPTED_TREE" ]]
          [[ "$(git diff --name-only --no-renames --ignore-submodules=none "$ACCEPTED_N" --)" == modules/init.txt ]]
          printf '%s  %s\n' 4142943d38594680549dc2dadae36b6f705d92377668fe39274f1cab1eacd767 modules/init.txt | sha256sum --check --status
          cat > "$STAGE/probe_selected.py" <<'PROBE'
          """Trace the four selected compiler commands on a disposable probe runner."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess
          import sys


          TARGETS = (
              "src/map/data/schema/main.cpp",
              "src/map/navmesh/navmesh_builder.cpp",
              "src/map/data/datasets/monstrosity/dataset.cpp",
              "src/map/ai/controllers/trust_controller.cpp",
          )
          COMPILER = "/usr/bin/clang++-22"


          def planned_commands(compile_db, source_root, build_root):
              rows = json.loads(compile_db.read_bytes())
              commands = {}
              for target in TARGETS:
                  source = source_root / target
                  hits = [row for row in rows if row["file"] == str(source)]
                  if len(hits) != 1 or Path(hits[0]["directory"]) != build_root:
                      raise ValueError("unexpected compile database row for " + target)
                  row = hits[0]
                  argv = shlex.split(row["command"])
                  if argv[0] != COMPILER or argv.count("-c") != 1 or argv[argv.index("-c") + 1] != str(source):
                      raise ValueError("unexpected compiler or source for " + target)
                  if any(
                      item.startswith(("@", "-Xclang", "-fplugin", "-load", "-wrapper", "--config", "--gcc-toolchain", "--sysroot"))
                      for item in argv
                  ):
                      raise ValueError("unexpected compiler option for " + target)
                  if not any(item == "-std=c++23" for item in argv):
                      raise ValueError("unexpected language mode for " + target)
                  for option, suffix in (("-o", ".o"), ("-MF", ".o.d")):
                      if option == "-MF" and option not in argv:
                          continue
                      if argv.count(option) != 1:
                          raise ValueError("unexpected output option for " + target)
                      output = (build_root / argv[argv.index(option) + 1]).resolve()
                      if not output.is_relative_to(build_root) or not output.name.endswith(suffix):
                          raise ValueError("unexpected output path for " + target)
                      if option == "-o" and (build_root / row["output"]).resolve() != output:
                          raise ValueError("compile output metadata mismatch for " + target)
                      if output.exists():
                          raise ValueError("stale compiler output for " + target)
                      output.parent.mkdir(parents=True, exist_ok=True)
                  commands[target] = argv
              return commands


          def main():
              source_root = Path(os.environ["TRACE_ROOT"])
              stage = Path(sys.argv[1])
              build_root = source_root / "build"
              codeql = (stage / "tool/codeql/codeql").resolve(strict=True)
              database = stage / "db"
              artifact = stage / "artifact"
              diagnostics = artifact / "selected.sarif"
              log_path = artifact / "commands.log"
              compile_db = build_root / "compile_commands.json"
              try:
                  commands = planned_commands(compile_db, source_root, build_root)
              except (OSError, ValueError, KeyError, TypeError, IndexError) as error:
                  (artifact / "probe.json").write_text(json.dumps({
                      "phase": "plan", "complete": False, "error": type(error).__name__,
                      "message": str(error)[:300],
                  }) + "\n")
                  print("Selected compilation diagnostic stopped while validating compiler inputs")
                  return
              query_dir = codeql.parent / "qlpacks/codeql/cpp-queries/1.10.0/Diagnostics"
              report = {"phase": "init", "commands": {}, "complete": False}
              report["compile_db_sha256"] = hashlib.sha256(compile_db.read_bytes()).hexdigest()
              with log_path.open("xb") as log:
                  def run(args, seconds=240):
                      return subprocess.run(
                          ["/usr/bin/timeout", "--kill-after=5s", f"{seconds}s", str(codeql), *args],
                          cwd=source_root, stdout=log, stderr=subprocess.STDOUT, check=False,
                      ).returncode

                  report["init_exit"] = run([
                      "database", "init", "--language=cpp", "--build-mode=manual",
                      "--source-root=" + str(source_root), str(database),
                  ])
                  if report["init_exit"] == 0:
                      report["phase"] = "trace"
                      for target, argv in commands.items():
                          report["commands"][target] = run([
                              "database", "trace-command", "--working-dir=" + str(build_root),
                              "--threads=1", "--extractor-option=cpp.log_verbosity=3",
                              "--", str(database), *argv,
                          ])
                      report["phase"] = "finalize"
                      report["finalize_exit"] = run(["database", "finalize", "--threads=1", str(database)])
                      if report["finalize_exit"] == 0:
                          report["phase"] = "queries"
                          report["query_exit"] = run([
                              "database", "analyze", "--threads=1", "--ram=2048",
                              "--format=sarifv2.1.0", "--sarif-include-diagnostics",
                              "--output=" + str(diagnostics), str(database),
                              *(str(query_dir / (query + ".ql")) for query in (
                                  "ExtractedFiles", "FailedExtractorInvocations", "ExtractionWarnings",
                              )),
                          ])
                          report["complete"] = report["query_exit"] == 0 and all(
                              rc == 0 for rc in report["commands"].values()
                          )
              (artifact / "probe.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
              with (artifact / "extractor-errors.txt").open("x") as evidence:
                  for entry in sorted((database / "log/extractor").rglob("*.log")):
                      evidence.write(str(entry.relative_to(database)) + "\n")
                      with entry.open(errors="replace") as file:
                          samples = 0
                          for line in file:
                              if any(text in line for text in ("internal error", "Extractor exiting with code", "signal ", "time limit")):
                                  evidence.write(line[:1200])
                                  samples += 1
                                  if samples == 20:
                                      break
              print("Selected compilation diagnostic phase", report["phase"], "complete", report["complete"])


          if __name__ == "__main__":
              main()
          PROBE
          cat > "$STAGE/check_extraction.py" <<'GUARD'
          """Check selected translation-unit evidence from pinned CodeQL diagnostics."""
          import argparse
          import json
          from pathlib import Path, PurePosixPath
          from urllib.parse import unquote


          def check_report(report, required):
              runs = report["runs"]
              if report["version"] != "2.1.0" or len(runs) != 1:
                  raise ValueError("unexpected SARIF format or run count")
              run = runs[0]
              driver = run["tool"]["driver"]
              if driver["name"] != "CodeQL" or driver["semanticVersion"] != "2.27.4":
                  raise ValueError("unexpected CodeQL tool version")
              invocations = run["invocations"]
              if len(invocations) != 1:
                  raise ValueError("unexpected invocation count")
              if invocations[0].get("executionSuccessful") is not True:
                  raise ValueError("unsuccessful CodeQL invocation")
              notes = invocations[0]["toolExecutionNotifications"]
              extracted = set()
              aborted = 0
              other_errors = 0
              warnings = 0
              for note in notes:
                  rule = note["descriptor"]["id"]
                  if rule == "cpp/diagnostics/failed-extractor-invocations":
                      aborted += 1
                  elif note.get("level") == "error":
                      other_errors += 1
                  elif rule == "cpp/diagnostics/extraction-warnings":
                      warnings += 1
                  elif rule == "cpp/diagnostics/successfully-extracted-files":
                      for location in note["locations"]:
                          artifact = location["physicalLocation"]["artifactLocation"]
                          if artifact.get("uriBaseId") not in (None, "%SRCROOT%"):
                              continue
                          uri = PurePosixPath(unquote(artifact["uri"]))
                          if not uri.is_absolute() and ".." not in uri.parts:
                              extracted.add(uri.as_posix())
              return {
                  "aborted": aborted,
                  "other_errors": other_errors,
                  "warnings": warnings,
                  "extracted": sorted(required & extracted),
                  "missing": sorted(required - extracted),
              }


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("report", type=Path)
              parser.add_argument("required", nargs="+")
              args = parser.parse_args()
              required = set(args.required)
              if len(required) != len(args.required) or any(
                  PurePosixPath(path).as_posix() != path
                  or path.startswith("/")
                  or ".." in PurePosixPath(path).parts
                  or PurePosixPath(path).suffix != ".cpp"
                  for path in required
              ):
                  parser.error("expected unique source-relative .cpp paths")
              with args.report.open("rb") as file:
                  data = file.read(32 * 1024 * 1024 + 1)
              if len(data) > 32 * 1024 * 1024:
                  parser.error("report exceeds input limit")
              try:
                  result = check_report(json.loads(data), required)
              except (KeyError, TypeError, ValueError) as error:
                  parser.error(f"invalid extraction report: {type(error).__name__}")
              print(json.dumps(result, sort_keys=True))
              return int(bool(result["aborted"] or result["other_errors"] or result["missing"]))


          if __name__ == "__main__":
              raise SystemExit(main())
          GUARD
          if [[ "$configure_exit" == 0 ]]; then
            "${offline[@]}" "$TRACE_PY" -IB "$STAGE/probe_selected.py" "$STAGE"
          else
            printf '{"phase":"configure","configure_exit":%d,"complete":false}\n' "$configure_exit" \
              > "$STAGE/artifact/probe.json"
          fi
          [[ "$(git rev-parse HEAD)" == "$ACCEPTED_N" && "$(git rev-parse HEAD^{tree})" == "$ACCEPTED_TREE" ]]
          [[ "$(git diff --name-only --no-renames --ignore-submodules=none "$ACCEPTED_N" --)" == modules/init.txt ]]
          printf '%s  %s\n' 4142943d38594680549dc2dadae36b6f705d92377668fe39274f1cab1eacd767 modules/init.txt | sha256sum --check --status
          printf 'Source %s %s, workflow %s, runner image %s, run %s\n' \
            "$ACCEPTED_N" "$ACCEPTED_TREE" "$EXPECTED_WORKFLOW" "$ImageVersion" "$GITHUB_RUN_ID" \
            > "$STAGE/artifact/source.txt"

      - name: Encrypt the diagnostic artifact
        run: |
          set -euo pipefail
          umask 077
          members=(codeql-version.json configure.log probe.json source.txt)
          for optional in commands.log extractor-errors.txt selected.sarif; do
            if [[ -e "$STAGE/artifact/$optional" ]]; then members+=("$optional"); fi
          done
          for member in "${members[@]}"; do
            [[ -f "$STAGE/artifact/$member" && ! -L "$STAGE/artifact/$member" ]]
          done
          ciphertext="$STAGE/public/selected-cpp-diagnostic.cms"
          /usr/bin/tar --format=ustar -C "$STAGE/artifact" -cf - "${members[@]}" |
            /usr/bin/openssl cms -encrypt -aes-256-gcm -binary -outform DER \
              -out "$ciphertext" -recip "$STAGE/recipient.pem" \
              -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 -keyopt rsa_mgf1_md:sha256
          [[ -s "$ciphertext" ]]
          /usr/bin/openssl cms -cmsout -inform DER -in "$ciphertext" -noout
          sha256sum "$ciphertext"

      - name: Publish only the encrypted diagnostic artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: selected-cpp-diagnostic-${{ matrix.probe.name }}-encrypted
          path: ${{ env.STAGE }}/public/selected-cpp-diagnostic.cms
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Report selected source coverage
        run: |
          set -euo pipefail
          python="$STAGE/venv/bin/python"
          "$python" -IB -c 'import json, sys; assert json.load(open(sys.argv[1]))["complete"] is True' \
            "$STAGE/artifact/probe.json"
          "$python" -IB "$STAGE/check_extraction.py" "$STAGE/artifact/selected.sarif" \
            src/map/data/schema/main.cpp \
            src/map/navmesh/navmesh_builder.cpp \
            src/map/data/datasets/monstrosity/dataset.cpp \
            src/map/ai/controllers/trust_controller.cpp

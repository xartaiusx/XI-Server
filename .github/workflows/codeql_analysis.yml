name: CodeQL Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # At 12:00 every day.
    - cron:  '0 12 * * *'
  # Or by request
  workflow_dispatch:

jobs:
  analyze:
    # Preserve the existing required check names when extending the matrix.
    name: Analyze (${{ matrix.language }}, ${{ matrix.build-mode }})${{ matrix.legacy && ' legacy' || '' }}${{ matrix.windows_security && ' Windows security' || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: "true"
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: none
            runner: ubuntu-26.04
            category: .github/workflows/codeql_analysis.yml:analyze/build-mode:none/language:cpp
          - language: cpp
            build-mode: manual
            runner: ubuntu-26.04
            # Refresh historical alerts with the fully traced compiler context.
            category: .github/workflows/codeql_analysis.yml:analyze/language:cpp
          - language: python
            build-mode: none
            runner: ubuntu-latest
            category: .github/workflows/codeql_analysis.yml:analyze/build-mode:none/language:python
          - language: python
            build-mode: none
            runner: ubuntu-latest
            legacy: true
            category: .github/workflows/codeql_analysis.yml:analyze/language:python
          - language: cpp
            build-mode: manual
            runner: windows-2022
            windows_security: true
            category: .github/workflows/codeql_analysis.yml:analyze/build-mode:manual/language:cpp/platform:windows-security

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'

    - name: Install Dependencies
      if: matrix.language == 'cpp' && runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --assume-yes --no-install-recommends --quiet \
          g++-15 cmake ninja-build libmariadb-dev-compat libluajit-5.1-dev \
          libzmq3-dev zlib1g-dev libssl-dev binutils-dev libzstd-dev libdwarf-dev
        echo "CC=/usr/bin/gcc-15" >> "$GITHUB_ENV"
        echo "CXX=/usr/bin/g++-15" >> "$GITHUB_ENV"
        python -m pip install jinja2 jsonschema ruamel.yaml

    - name: Setup MSVC
      if: matrix.windows_security
      uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4
      with:
        arch: x64
        vs-path: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
        toolset: '14.44'
        sdk: '10.0.26100.0'

    - name: Verify Windows security toolchain
      if: matrix.windows_security
      run: |
        python - <<'PY'
        import json
        import ntpath
        import os
        from pathlib import Path
        import re
        import subprocess

        compiler = Path("C:/Program Files/LLVM/bin/clang-cl.exe")
        visual_studio = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise"
        if not compiler.is_file():
            raise SystemExit("Required clang-cl executable is missing")
        if ntpath.normcase(ntpath.normpath(os.environ.get("VSINSTALLDIR", ""))) != ntpath.normcase(ntpath.normpath(visual_studio)):
            raise SystemExit("Unexpected Visual Studio developer environment")
        toolset = os.environ.get("VCToolsVersion", "").rstrip("/\\")
        if not re.fullmatch(r"14\.44\.\d+", toolset):
            raise SystemExit("Required MSVC14.44 toolset is not selected")
        sdk = os.environ.get("WindowsSDKVersion", "").rstrip("/\\")
        if sdk != "10.0.26100.0":
            raise SystemExit("Required Windows SDK10.0.26100.0 is not selected")
        version = subprocess.run([str(compiler), "--version"], check=True, capture_output=True, text=True, timeout=15)
        if len(version.stdout) + len(version.stderr) > 32768:
            raise SystemExit("Compiler version output exceeds its bound")
        if not re.search(r"clang version 20\.1\.8(?:\s|$)", version.stdout):
            raise SystemExit("Required clang-cl20.1.8 is not selected")
        if not re.search(r"^Target: x86_64-pc-windows-msvc(?:[0-9.]+)?$", version.stdout, re.MULTILINE):
            raise SystemExit("Required Windows x64 compiler target is not selected")
        print(json.dumps({"compiler": str(compiler), "version": "20.1.8", "target": "x86_64-pc-windows-msvc", "visual_studio": visual_studio, "toolset": toolset, "windows_sdk": sdk, "image": os.environ.get("ImageOS"), "image_version": os.environ.get("ImageVersion")}))
        PY

    - name: Install Windows codegen dependencies
      if: matrix.windows_security
      run: python -m pip install jinja2 jsonschema ruamel.yaml

    - name: Configure C++ extraction context
      if: matrix.language == 'cpp' && runner.os == 'Linux'
      run: |
        # CI-only configuration: never enable packet capture on a live server.
        python - <<'PY'
        from pathlib import Path
        Path("modules/init.txt").write_text("custom\nera/lua\nexample\ntools/packetcap\n")
        PY
        "$CXX" --version
        cmake -G Ninja -S . -B build --fresh \
          -DCMAKE_BUILD_TYPE=Debug -DPCH_ENABLE=OFF -DENABLE_IPO=OFF \
          -DCACHE_BINARY:FILEPATH= \
          -DCMAKE_C_COMPILER_LAUNCHER:STRING= \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=
        cmake --build build --target enum_codegen --parallel 4

    - name: Configure Windows security extraction context
      if: matrix.windows_security
      run: |
        cmake -G Ninja -S . -B build --fresh \
          -DCMAKE_C_COMPILER:FILEPATH="C:/Program Files/LLVM/bin/clang-cl.exe" \
          -DCMAKE_CXX_COMPILER:FILEPATH="C:/Program Files/LLVM/bin/clang-cl.exe" \
          -DCMAKE_BUILD_TYPE=Debug -DPCH_ENABLE=OFF -DENABLE_IPO=OFF \
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
          -DCACHE_BINARY:FILEPATH= \
          -DCMAKE_C_COMPILER_LAUNCHER:STRING= \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=

    - name: Verify Windows security CMake context
      if: matrix.windows_security
      run: |
        python - <<'PY'
        import json
        import ntpath
        from pathlib import Path
        import re
        import shlex

        root = Path.cwd()
        build = root / "build"
        expected_compiler = ntpath.normcase("C:\\Program Files\\LLVM\\bin\\clang-cl.exe")
        for language in ("C", "CXX"):
            files = list((build / "CMakeFiles").glob(f"*/CMake{language}Compiler.cmake"))
            if len(files) != 1:
                raise SystemExit("Missing or ambiguous native CMake compiler context")
            values = dict(re.findall(rf'^set\(CMAKE_{language}_(COMPILER|COMPILER_ID|COMPILER_VERSION|COMPILER_FRONTEND_VARIANT) "([^"\n]*)"\)$', files[0].read_text(), re.MULTILINE))
            if ntpath.normcase(ntpath.normpath(values.get("COMPILER", ""))) != expected_compiler:
                raise SystemExit("CMake selected an unexpected compiler path")
            if any(values.get(key) != value for key, value in {"COMPILER_ID": "Clang", "COMPILER_VERSION": "20.1.8", "COMPILER_FRONTEND_VARIANT": "MSVC"}.items()):
                raise SystemExit("CMake selected an unexpected compiler identity")
        commands_file = build / "compile_commands.json"
        if not 0 < commands_file.stat().st_size <= 16777216:
            raise SystemExit("Native compilation database exceeds its bound")
        commands = json.loads(commands_file.read_text())
        if not isinstance(commands, list):
            raise SystemExit("Invalid native compilation database")
        checked = 0
        for entry in commands:
            source = Path(entry["file"])
            try:
                relative = source.resolve().relative_to(root)
            except ValueError:
                continue
            if relative.parts[0] not in {"src", "modules"} or source.suffix not in {".cpp", ".cc", ".cxx", ".c++"}:
                continue
            standards = [arg for arg in shlex.split(entry["command"], posix=False) if re.match(r"[-/](?:clang:)?-?std[:=]", arg)]
            if standards != ["-clang:-std=c++23"]:
                raise SystemExit("First-party C++ compilation is not explicitly C++23")
            checked += 1
        if not checked:
            raise SystemExit("No first-party C++ compilation context was verified")
        print(json.dumps({"compiler_id": "Clang", "version": "20.1.8", "frontend": "MSVC", "standard_flag": "-clang:-std=c++23", "first_party_commands": checked}))
        PY
        cmake --build build --target enum_codegen --parallel 4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        trap-caching: false
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml
        # '+' supplements, never replaces, the full configured query suites.
        queries: ${{ matrix.language == 'cpp' && '+./.github/codeql/security-coverage' || '' }}

    - name: Build traced schema context
      if: matrix.build-mode == 'manual'
      run: |
        # This also compiles common/data libraries: keep every native object under tracing.
        cmake --build build --target data_schema_generate --parallel 4

    - if: matrix.build-mode == 'manual' && !matrix.windows_security
      name: Trace all server targets and modules
      run: |
        # Fresh objects, no compiler cache/PCH: every compilation must be traced.
        cmake --build build --target xi_connect xi_map xi_profile xi_search xi_world xi_test --parallel 4

    - name: Trace Windows TLS and private-file targets
      if: matrix.windows_security
      run: cmake --build build --target xi_connect xi_profile --parallel 4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        upload: false
        output: sarif-results
        category: ${{ matrix.category }}

    - name: Check raw coverage and diagnostics
      env:
        COVERAGE_OUTPUT: ${{ runner.temp }}/codeql-coverage-${{ matrix.language }}-${{ matrix.build-mode }}.json
      run: |
        python tools/mochirii/codeql_coverage.py \
          --sarif sarif-results/${{ matrix.language }}.sarif \
          --output "$COVERAGE_OUTPUT" \
          --language '${{ matrix.language }}' \
          --category '${{ matrix.category }}' \
          --source-sha "$GITHUB_SHA" \
          ${{ matrix.windows_security && '--require-windows-security' || (matrix.build-mode == 'manual' && '--require-cpp-recovery' || '') }}

    - name: Preserve raw SARIF and coverage evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: CodeQL_raw_${{ matrix.language }}_${{ matrix.build-mode }}_${{ matrix.legacy && 'legacy_' || '' }}${{ matrix.windows_security && 'windows-security_' || '' }}${{ github.sha }}
        path: |
          sarif-results/${{ matrix.language }}.sarif
          ${{ runner.temp }}/codeql-coverage-${{ matrix.language }}-${{ matrix.build-mode }}.json
        if-no-files-found: error
        retention-days: 7

    - name: Filter SARIF
      uses: zbazztian/filter-sarif@30183a0a595e8a890f1624ebba3788ce5b58711b # master as of 2022-07-26
      with:
        patterns: |
          -ext/**/*
          -build/**/*
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif

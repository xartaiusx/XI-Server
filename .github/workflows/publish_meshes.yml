name: Publish Meshes Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue rather than cancel: a cancelled run leaves its revision tag unpublished.
  cancel-in-progress: false

jobs:
  Meshes_Build:
    name: Build and Publish ximeshes Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Placeholder value. Actual value set in the first step.
      REPO_OWNER: 'landsandboat'
    steps:
      - name: Lowercase repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          submodules: true

      # Consumers need to know whether an image matches the meshes their branch pins.
      - name: Compute meshes revision
        id: meshes_rev
        run: echo "rev=$(git ls-tree HEAD navmeshes ximeshes | sha256sum | cut -c1-12)" >>${GITHUB_OUTPUT}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/ximeshes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.meshes_rev.outputs.rev }}
          labels: |
            org.opencontainers.image.authors=Mochirii
            org.opencontainers.image.title=FFXI Meshes
            org.opencontainers.image.description=Line-of-sight and navigation meshes for use with Mochirii.

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        with:
          context: .
          file: ./docker/meshes.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

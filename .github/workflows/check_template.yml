name: Check Template

on:
  pull_request_target:
    types: [opened, edited, reopened]
    branches:
      - main
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  Check_Checkboxes:
    name: Check Checkboxes
    runs-on: ubuntu-latest
    steps:
      - name: Validate completed template
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const isPullRequest = context.eventName === 'pull_request_target';
            const body = (isPullRequest
              ? context.payload.pull_request.body
              : context.payload.issue.body) || '';
            const visibleBody = body.replace(/<!--[\s\S]*?-->/g, '');
            const expected = isPullRequest ? 4 : 3;
            const completed = (visibleBody.match(/\[x\]/g) || []).length;
            if (completed < expected) {
              core.setFailed(`Complete the template checkboxes: ${completed}/${expected}.`);
            }

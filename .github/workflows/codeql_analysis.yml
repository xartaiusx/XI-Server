# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: CodeQL Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # At 12:00 every day.
    - cron:  '0 12 * * *'
  # Or by request
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ matrix.language == 'cpp' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.language == 'cpp' && 150 || 60 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Install C++ build dependencies
      if: matrix.build-mode == 'manual'
      run: |
        sudo apt-get update
        sudo apt-get install --assume-yes --no-install-recommends \
          binutils-dev clang-22 cmake g++ libclang-rt-22-dev libdwarf-dev \
          libluajit-5.1-dev libmariadb-dev-compat libssl-dev libzmq3-dev \
          libzstd-dev llvm-22-dev ninja-build zlib1g-dev

    - name: Setup Python for C++ code generation
      if: matrix.build-mode == 'manual'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'

    - name: Install code generation dependencies
      if: matrix.build-mode == 'manual'
      run: python -m pip install jinja2 jsonschema ruamel.yaml

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        trap-caching: false
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        config-file: ./.github/codeql/codeql-config.yml
        
    - name: Configure and build C++ for extraction
      if: matrix.build-mode == 'manual'
      env:
        CC: /usr/bin/clang-22
        CXX: /usr/bin/clang++-22
      run: |
        # Use the exact CPM bootstrap expected by CMake. The release API provides
        # the same bytes if the browser download endpoint is temporarily unavailable.
        cpm_cache="$GITHUB_WORKSPACE/.cpm-cache"
        cpm_file="$cpm_cache/cpm/CPM_0.40.2.cmake"
        cpm_sha256=c8cdc32c03816538ce22781ed72964dc864b2a34a310d3b7104812a5ca2d835d
        verify_cpm() {
          printf '%s  %s\n' "$cpm_sha256" "$1" | sha256sum --check --status
        }
        if [[ ! -f "$cpm_file" ]] || ! verify_cpm "$cpm_file"; then
          mkdir -p "$cpm_cache/cpm"
          cpm_download="$(mktemp "$RUNNER_TEMP/codeql-cpm.XXXXXX")"
          trap 'rm -f -- "$cpm_download"' EXIT
          curl_args=(--fail --silent --show-error --location --proto '=https' --proto-redir '=https'
                     --connect-timeout 10 --max-time 30 --max-filesize 65536 --output "$cpm_download")
          if ! curl "${curl_args[@]}" https://github.com/cpm-cmake/CPM.cmake/releases/download/v0.40.2/CPM.cmake ||
              ! verify_cpm "$cpm_download"; then
            curl "${curl_args[@]}" --header 'Accept: application/octet-stream' \
              'https://api.github.com/repos/cpm-cmake/CPM.cmake/releases/assets/183458005?download=1'
          fi
          verify_cpm "$cpm_download" || { echo '::error::CPM bootstrap SHA-256 mismatch'; exit 1; }
          mv -f -- "$cpm_download" "$cpm_file"
        fi

        # Match the module sources in the existing Modules Build job.
        printf '%s\n' custom era/lua example > modules/init.txt
        cmake -G Ninja -S . -B build --fresh \
          -DCMAKE_BUILD_TYPE=Debug -DTRACY_ENABLE=OFF -DPCH_ENABLE=OFF \
          -DCMAKE_C_FLAGS_DEBUG:STRING=-g0 -DCMAKE_CXX_FLAGS_DEBUG:STRING=-g0 \
          -DCPM_SOURCE_CACHE:PATH="$cpm_cache" \
          -DSTAGE_BINARIES=OFF -DCACHE_BINARY:FILEPATH= \
          -DCMAKE_C_COMPILER_LAUNCHER:FILEPATH= -DCMAKE_CXX_COMPILER_LAUNCHER:FILEPATH=
        cmake --build build --parallel 4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        # https://josh-ops.com/posts/github-codeql-ignore-files/
        upload: false # disable the upload here - we will upload in a different action
        output: sarif-results
        # Keep the established analysis identity when the C++ build mode changes.
        category: .github/workflows/codeql_analysis.yml:analyze/build-mode:none/language:${{ matrix.language }}

    - name: Filter SARIF
      uses: zbazztian/filter-sarif@30183a0a595e8a890f1624ebba3788ce5b58711b # master as of 2022-07-26
      with:
        patterns: |
          -ext/**/*
          -build/**/*
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif
        category: .github/workflows/codeql_analysis.yml:analyze/build-mode:none/language:${{ matrix.language }}

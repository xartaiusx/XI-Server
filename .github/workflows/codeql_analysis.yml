# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: CodeQL Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # At 12:00 every day.
    - cron:  '0 12 * * *'
  # Or by request
  workflow_dispatch:
    inputs:
      baseline_workflow_sha:
        description: Exact independently reviewed temporary baseline workflow commit
        required: false
        type: string
      baseline_runner_image:
        description: Exact previously observed ubuntu-26.04 runner image version
        required: false
        type: string
        default: '20261101.186.1'

jobs:
  analyze:
    if: >-
      github.ref != 'refs/heads/mochi/codeql-n8a34-baseline' &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'mochi/codeql-n8a34-baseline')
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: none
          - language: python
            build-mode: none
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common cmake ninja-build libmariadb-dev-compat libluajit-5.1-dev libzmq3-dev zlib1g-dev libssl-dev binutils-dev libzstd-dev libdwarf-dev

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        trap-caching: false
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        config-file: ./.github/codeql/codeql-config.yml
        
    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    # - name: Autobuild
    #   uses: github/codeql-action/autobuild@v4

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines. 
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    - if: matrix.build-mode == 'manual'
      name: Configure and Build
      run: |
        cmake -G Ninja -S . -B build
        cmake --build build -j4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        # https://josh-ops.com/posts/github-codeql-ignore-files/
        upload: false # disable the upload here - we will upload in a different action
        output: sarif-results

    - name: Filter SARIF
      uses: zbazztian/filter-sarif@30183a0a595e8a890f1624ebba3788ce5b58711b # master as of 2022-07-26
      with:
        patterns: |
          -ext/**/*
          -build/**/*
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif

  accepted_n_artifact:
    name: Accepted N compiled CodeQL artifact
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mochi/codeql-n8a34-baseline'
    runs-on: ubuntu-26.04
    timeout-minutes: 210
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ACCEPTED_N: 8a34d1baaeded1665ef8101eba2cf2190d3d83f3
      ACCEPTED_TREE: 922c92a7a2ff848d3c9d442ba55fcdb21f546db7
      BASELINE_CATEGORY: .github/workflows/codeql_analysis.yml:analyze/build-mode:none/language:cpp
      STAGE: ${{ runner.temp }}/n8a34-codeql
      EXPECTED_WORKFLOW: ${{ inputs.baseline_workflow_sha }}
      EXPECTED_IMAGE: ${{ inputs.baseline_runner_image }}

    steps:
      - name: Verify the exact authorized dispatch
        env:
          ACTUAL_WORKFLOW: ${{ github.workflow_sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == xartaiusx/XI-Server ]]
          [[ "$GITHUB_ACTOR" == xartaiusx && "$TRIGGERING_ACTOR" == xartaiusx ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_SHA" == "$ACTUAL_WORKFLOW" ]]
          [[ "$EXPECTED_WORKFLOW" =~ ^[0-9a-f]{40}$ && "$ACTUAL_WORKFLOW" == "$EXPECTED_WORKFLOW" ]]
          [[ "$EXPECTED_IMAGE" =~ ^[0-9]{8}[.][0-9]+[.][0-9]+$ && "$ImageVersion" == "$EXPECTED_IMAGE" ]]
          [[ "$STAGE" == "$RUNNER_TEMP/n8a34-codeql" && "$STAGE" =~ ^/[A-Za-z0-9_./-]+/n8a34-codeql$ ]]
          mkdir -- "$STAGE"
          mkdir -- "$STAGE/artifact" "$STAGE/tool" "$STAGE/public"
          recipient_sha=57b5f0ad99ed73fe52a4d9939be0ad35458cc004d3b464164b1c8f0d232937c8
          [[ "$recipient_sha" =~ ^[0-9a-f]{64}$ ]]
          cat > "$STAGE/recipient.pem" <<'RECIPIENT'

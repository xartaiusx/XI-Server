name: Reusable Runner Build Workflow

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner to run the build on.'
        required: true
        type: string
      compiler:
        description: 'Compiler to build with.'
        required: true
        type: string
      compiler_version:
        description: 'Compiler version to build with.'
        required: false
        type: string
      build_type:
        description: 'CMake build type.'
        required: true
        type: string
      save_cache:
        description: 'Save the sccache and CPM caches. PR builds only read them.'
        required: false
        type: boolean
        default: false
      build_modules:
        description: 'Build with modules enabled.'
        required: false
        type: boolean
        default: false
      tracy:
        description: 'Build with tracy enabled.'
        required: false
        type: boolean
        default: false
      upload_artifact:
        description: 'Upload built executables.'
        required: false
        type: boolean
        default: false
      clang_tidy:
        description: 'Run clang-tidy over the compile database instead of building, and output a summary.'
        required: false
        type: boolean
        default: false
      optional_build:
        description: 'Skip build if no relevant files changed (requires changed-files artifact).'
        required: false
        type: boolean
        default: false

jobs:
  Runner_Build:
    name: ${{ format('{0}, {1}{2}, {3}', inputs.runner, inputs.compiler, inputs.compiler_version, inputs.build_type) }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    env:
      # sccache's GHA backend stored one entry per object, which hit GitHub's upload rate limit and kept the 10GB budget full.
      # The local cache dir is saved instead, one entry per toolchain, capped so all of them plus CPM fit.
      SCCACHE_DIR: ${{ format('{0}/.sccache', github.workspace) }}
      SCCACHE_CACHE_SIZE: 1500M
      CPM_SOURCE_CACHE: ${{ format('{0}/.cpm-cache', github.workspace) }}
      SKIP_BUILD: false
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Download changed files artifact
        if: ${{ inputs.optional_build }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: changed-files

      # Only the optional_build path needs bash 4 for mapfile; the runner ships bash 3.2.
      - name: Install bash (macOS)
        if: ${{ runner.os == 'macOS' && inputs.optional_build }}
        run: brew install --quiet bash

      - name: Check for changed source files
        id: check-changes
        if: ${{ inputs.optional_build }}
        run: |
          mapfile -t changed_files < changed-files.txt
          source_changes=false
          for changed_file in "${changed_files[@]}"; do
          if [[ $changed_file == src/**/*.cpp || $changed_file == modules/**/*.cpp || \
                $changed_file == src/**/*.h   || $changed_file == modules/**/*.h   || \
                $changed_file == src/**/CMakeLists.txt || $changed_file == modules/**/CMakeLists.txt || \
                $changed_file == CMakeLists.txt || \
                $changed_file == cmake/*.cmake ]]; then
              source_changes=true
              break
            fi
          done
          echo "SKIP_BUILD=$([[ $source_changes == false && ${{ inputs.optional_build }} == true ]] && echo 'true' || echo 'false')" >> $GITHUB_ENV

      - name: Checkout
        if: ${{ env.SKIP_BUILD != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install dependencies (macOS)
        if: ${{ runner.os == 'macOS' && env.SKIP_BUILD != 'true' }}
        run: |
          brew install --quiet \
            mariadb \
            zeromq \
            luajit \
            ninja

      - name: Setup LLVM Clang (macOS)
        if: ${{ runner.os == 'macOS' && startsWith(inputs.compiler, 'clang') && env.SKIP_BUILD != 'true' }}
        run: |
          brew install --quiet \
            llvm@${{ inputs.compiler_version }} \
            lld@${{ inputs.compiler_version }}

          LLVM_PREFIX=$(brew --prefix llvm@${{ inputs.compiler_version }})
          LLD_PREFIX=$(brew --prefix lld@${{ inputs.compiler_version }})

          echo "PATH=$LLVM_PREFIX/bin:$LLD_PREFIX/bin:$PATH" >> $GITHUB_ENV
          echo "AR=$LLVM_PREFIX/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$LLVM_PREFIX/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "NM=$LLVM_PREFIX/bin/llvm-nm" >> $GITHUB_ENV

          echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
          echo "CXXFLAGS=-flto=thin" >> $GITHUB_ENV
          echo "LDFLAGS=-fuse-ld=lld -flto=thin" >> $GITHUB_ENV

      - name: Setup GCC (macOS)
        if: ${{ runner.os == 'macOS' && startsWith(inputs.compiler, 'gcc') && env.SKIP_BUILD != 'true' }}
        run: |
          brew install --quiet gcc@${{ inputs.compiler_version }}
          GCC_PREFIX=$(brew --prefix gcc@${{ inputs.compiler_version }})
          echo "PATH=$GCC_PREFIX/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$GCC_PREFIX/bin/gcc-${{ inputs.compiler_version }}" >> $GITHUB_ENV
          echo "CXX=$GCC_PREFIX/bin/g++-${{ inputs.compiler_version }}" >> $GITHUB_ENV

      - name: Install dependencies (Linux)
        if: ${{ runner.os == 'Linux' && env.SKIP_BUILD != 'true' }}
        run: |
          sudo apt-get update && sudo apt-get install --assume-yes --no-install-recommends --quiet \
            binutils-dev \
            libdwarf-dev \
            libluajit-5.1-dev \
            libmariadb-dev-compat \
            libssl-dev \
            libzmq3-dev \
            luajit \
            mariadb-client \
            tzdata \
            zlib1g-dev \
            libzstd-dev

      - name: Setup GCC (Linux)
        if: ${{ runner.os == 'Linux' && startsWith(inputs.compiler, 'gcc') && env.SKIP_BUILD != 'true' }}
        env:
          gcc_version: ${{ inputs.compiler_version && format('-{0}', inputs.compiler_version) || '' }}
        run: |
          sudo apt-get update && sudo apt-get install --assume-yes --no-install-recommends --quiet g++${{ env.gcc_version }}
          echo "CC=/usr/bin/gcc${{ env.gcc_version }}" >> $GITHUB_ENV
          echo "CXX=/usr/bin/g++${{ env.gcc_version }}" >> $GITHUB_ENV

      - name: Setup Clang (Linux)
        if: ${{ runner.os == 'Linux' && startsWith(inputs.compiler, 'clang') && env.SKIP_BUILD != 'true' }}
        env:
          clang_version: ${{ inputs.compiler_version && format('-{0}', inputs.compiler_version) || '' }}
        run: |
          sudo apt-get update && sudo apt-get install --assume-yes --no-install-recommends --quiet \
            g++ \
            clang${{ env.clang_version }} \
            clang-tidy${{ env.clang_version }} \
            libclang-rt${{ env.clang_version }}-dev \
            llvm${{ env.clang_version }}-dev
          echo "CC=/usr/bin/clang${{ env.clang_version }}" >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++${{ env.clang_version }}" >> $GITHUB_ENV

      # ctcache hashes the preprocessed TU together with the clang-tidy config and replays the stored output for anything it has already seen, so only touched TUs get re-analysed.
      - name: Setup clang-tidy-cache
        if: ${{ inputs.clang_tidy && env.SKIP_BUILD != 'true' }}
        env:
          clang_version: ${{ inputs.compiler_version && format('-{0}', inputs.compiler_version) || '' }}
        run: |
          sudo curl -sSfL -o /usr/local/bin/clang-tidy-cache https://raw.githubusercontent.com/matus-chochlik/ctcache/1.2.0/src/ctcache/clang_tidy_cache.py
          echo "a1b677a8b0ba318c330b043582872e40ddfe797c6499682cf0033ae9c5665e07  /usr/local/bin/clang-tidy-cache" | sha256sum -c -
          sudo chmod +x /usr/local/bin/clang-tidy-cache
          printf '#!/bin/sh\nexec clang-tidy-cache clang-tidy%s "$@"\n' "$clang_version" > "$RUNNER_TEMP/clang-tidy-cached"
          chmod +x "$RUNNER_TEMP/clang-tidy-cached"
          echo "CTCACHE_DIR=$GITHUB_WORKSPACE/.ctcache" >> $GITHUB_ENV
          echo "CTCACHE_SAVE_OUTPUT=1" >> $GITHUB_ENV

      - name: Restore clang-tidy cache
        id: ctcache
        if: ${{ inputs.clang_tidy && env.SKIP_BUILD != 'true' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ctcache
          key: ${{ format('ctcache-{0}-{1}', runner.os, github.run_id) }}
          restore-keys: |
            ${{ format('ctcache-{0}-', runner.os) }}

      # Static, ASAN-instrumented LuaJIT on the system allocator so ASAN tracks every Lua object.
      # The interpreter and JIT traces stay uninstrumented.
      - name: Build instrumented LuaJIT (Linux)
        if: ${{ runner.os == 'Linux' && inputs.build_type == 'ASAN' && env.SKIP_BUILD != 'true' }}
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git $RUNNER_TEMP/luajit
          make -C $RUNNER_TEMP/luajit -j$(nproc) BUILDMODE=static XCFLAGS="-DLUAJIT_USE_SYSMALLOC" HOST_CC="$CC" \
            CC="$CC -fsanitize=address -fsanitize-recover=address -fno-omit-frame-pointer"
          sudo make -C $RUNNER_TEMP/luajit install BUILDMODE=static PREFIX=/usr/local

      - name: Setup MSVC
        if: ${{ runner.os == 'Windows' && env.SKIP_BUILD != 'true' }}
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4
        with:
          arch: x64

      # sccache keys on the compiler itself, so this is diagnostic only: it names the
      # toolchain in the log when a runner image bump changes it underneath us.
      - name: Log toolchain
        if: ${{ env.SKIP_BUILD != 'true' }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cl.exe 2>&1 | head -1
          else
            "${CXX:-c++}" --version | head -1
          fi || true

      - name: Setup sccache
        id: sccache-setup
        if: ${{ env.SKIP_BUILD != 'true' }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.19.0
          token: ''
          # This action's post step otherwise attempts to execute an unset path.
          disable_annotations: 'true'

      # Only the base Debug cache builds save, one entry per toolchain.
      - name: Restore sccache
        id: sccache-cache
        if: ${{ inputs.build_type == 'Debug' && !inputs.clang_tidy && env.SKIP_BUILD != 'true' && steps.sccache-setup.outcome == 'success' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .sccache
          key: ${{ format('sccache-{0}-{1}{2}-{3}-{4}', runner.os, inputs.compiler, inputs.compiler_version, inputs.build_type, github.run_id) }}
          restore-keys: |
            ${{ format('sccache-{0}-{1}{2}-{3}-', runner.os, inputs.compiler, inputs.compiler_version, inputs.build_type) }}

      - name: Setup Python
        if: ${{ env.SKIP_BUILD != 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install Python codegen deps
        if: ${{ env.SKIP_BUILD != 'true' }}
        run: python -m pip install jinja2 jsonschema ruamel.yaml

      - name: Enable modules
        if: ${{ inputs.build_modules && env.SKIP_BUILD != 'true' }}
        run: |
          python3 <<EOF
          with open("modules/init.txt", "w") as f:
              f.write("custom\n")
              f.write("era/lua\n")
              f.write("example\n")
          EOF

      # Roughly 20 CPM packages are git-cloned at configure time. They used to survive
      # inside the cached build tree; this keeps them out of the network path.
      - name: Restore CPM sources
        id: cpm-cache
        if: ${{ env.SKIP_BUILD != 'true' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cpm-cache
          key: ${{ format('cpm-{0}-{1}', runner.os, hashFiles('CMakeLists.txt', 'cmake/**', 'ext/CMakeLists.txt')) }}
          restore-keys: |
            ${{ format('cpm-{0}-', runner.os) }}

      - name: Configure CMake
        if: ${{ env.SKIP_BUILD != 'true' }}
        env:
          SCCACHE_SETUP_OUTCOME: ${{ steps.sccache-setup.outcome }}
        run: |
          cache_args=(-DCACHE_OPTION=sccache)
          if [[ "$SCCACHE_SETUP_OUTCOME" != success ]]; then
            echo "::warning::sccache setup failed. Building without a compiler cache."
            cache_args+=(-DCACHE_BINARY:FILEPATH= -DCMAKE_C_COMPILER_LAUNCHER:FILEPATH= -DCMAKE_CXX_COMPILER_LAUNCHER:FILEPATH=)
          fi
          cmake -G Ninja -S . -B build --fresh \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DTRACY_ENABLE=${{ inputs.tracy && 'ON' || 'OFF' }} \
            -DPCH_ENABLE=OFF \
            ${{ (runner.os == 'macOS' && startsWith(inputs.compiler, 'clang')) && '-DCMAKE_AR=$AR -DCMAKE_RANLIB=$RANLIB -DCMAKE_NM=$NM ' || '' }} \
            ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded ' || '' }} \
            "${cache_args[@]}"

      # The sources are the same for every toolchain on an OS, so the Linux clang cache build leaves the save to gcc.
      - name: Save CPM sources
        if: ${{ github.event_name != 'pull_request' && inputs.save_cache && inputs.compiler != 'clang' && steps.cpm-cache.outputs.cache-hit != 'true' && env.SKIP_BUILD != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cpm-cache
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        if: ${{ !inputs.clang_tidy && env.SKIP_BUILD != 'true' }}
        run: cmake --build build | tee build.log

      # Stopping the server flushes pending writes before the directory is saved, and prints the stats.
      - name: Stop sccache
        if: ${{ !cancelled() && !inputs.clang_tidy && env.SKIP_BUILD != 'true' && steps.sccache-setup.outcome == 'success' }}
        run: sccache --stop-server || true

      - name: Save sccache
        id: sccache-save
        if: ${{ !cancelled() && github.event_name != 'pull_request' && inputs.save_cache && !inputs.clang_tidy && env.SKIP_BUILD != 'true' && steps.sccache-setup.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .sccache
          key: ${{ steps.sccache-cache.outputs.cache-primary-key }}

      # Only the newest entry is ever restored, so older ones are dead weight until LRU gets to them.
      - name: Clang Tidy
        if: ${{ inputs.clang_tidy && env.SKIP_BUILD != 'true' }}
        env:
          clang_version: ${{ inputs.compiler_version && format('-{0}', inputs.compiler_version) || '' }}
        run: |
          cmake --build build --target enum_codegen
          run-clang-tidy${{ env.clang_version }} -p build -j $(nproc) -quiet \
            -clang-tidy-binary "$RUNNER_TEMP/clang-tidy-cached" \
            "^${GITHUB_WORKSPACE}/(src|build/generated)/" | tee clang_tidy.log

      - name: Save clang-tidy cache
        if: ${{ github.event_name != 'pull_request' && inputs.save_cache && !cancelled() && inputs.clang_tidy && env.SKIP_BUILD != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ctcache
          key: ${{ steps.ctcache.outputs.cache-primary-key }}

      - name: clang-tidy cache stats
        if: ${{ !cancelled() && inputs.clang_tidy && env.SKIP_BUILD != 'true' }}
        run: clang-tidy-cache --show-stats || true

      - name: Upload artifact
        if: ${{ inputs.upload_artifact && env.SKIP_BUILD != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ format('LSB_{0}_{1}_{2}', runner.os, inputs.build_type, github.sha) }}
          path: |
            xi_*
            tracy.tar.gz

      - name: Summarize Clang Tidy
        if: ${{ !cancelled() && inputs.clang_tidy && env.SKIP_BUILD != 'true' }}
        run: |
          echo "## Clang Tidy Results" >> $GITHUB_STEP_SUMMARY
          if [[ -f "clang_tidy.log" && -s "clang_tidy.log" ]]; then
              python tools/ci/summarize_clang_tidy.py clang_tidy.log >> $GITHUB_STEP_SUMMARY
              if [[ $? -ne 0 ]]; then
                  exit 1
              fi
          fi

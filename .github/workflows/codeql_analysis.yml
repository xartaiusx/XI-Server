# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: CodeQL Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # At 12:00 every day.
    - cron:  '0 12 * * *'
  # Or by request
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: none
          - language: python
            build-mode: none
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common cmake ninja-build libmariadb-dev-compat libluajit-5.1-dev libzmq3-dev zlib1g-dev libssl-dev binutils-dev libzstd-dev libdwarf-dev

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        trap-caching: false
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        config-file: ./.github/codeql/codeql-config.yml
        
    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    # - name: Autobuild
    #   uses: github/codeql-action/autobuild@v4

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines. 
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    - if: matrix.build-mode == 'manual'
      name: Configure and Build
      run: |
        cmake -G Ninja -S . -B build
        cmake --build build -j4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        # https://josh-ops.com/posts/github-codeql-ignore-files/
        upload: false # disable the upload here - we will upload in a different action
        output: sarif-results

    - name: Filter SARIF
      uses: zbazztian/filter-sarif@30183a0a595e8a890f1624ebba3788ce5b58711b # master as of 2022-07-26
      with:
        patterns: |
          -ext/**/*
          -build/**/*
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif

  # PR55-only query-mode experiment: fresh non-overlay extraction in BOTH lanes.
  controlled-cpp-diagnostic:
    name: Controlled C++ diagnostic (${{ matrix.mode }})
    if: github.event_name == 'pull_request' && github.repository == 'xartaiusx/XI-Server' && github.event.pull_request.number == 55
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: full
            diff-informed: 'false'
          - mode: diff-informed
            diff-informed: 'true'
    env:
      MODE: ${{ matrix.mode }}
      CODEQL_OVERLAY_DATABASE_MODE: none
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: ${{ matrix.diff-informed }}
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: 'true'
      CODEQL_ACTION_DEBUG_COMBINED_SARIF: 'false'
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify unchanged program and private diagnostic contract
        env:
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$EVENT" = pull_request
          test "$REPOSITORY" = xartaiusx/XI-Server
          test "$HEAD_REPOSITORY" = xartaiusx/XI-Server
          test "$PR_NUMBER" = 55
          test "$BASE_SHA" = 02c7f2f7729161b1fd3e9588bc28f7c1c652b02a
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${RUNNER_DEBUG:-0}" != 1
          git fetch --no-tags --depth=1 origin 8037f00c446608e0204d9a0ebb9789c182522288
          expected=$'.github/scripts/codeql_pr55_diagnostic.py\n.github/workflows/codeql_analysis.yml'
          test "$(git diff --name-only 8037f00c446608e0204d9a0ebb9789c182522288 HEAD)" = "$expected"
          printf '%s  %s\n' 74a276b81502c0bb9052e7002962f6abfe7c263c17a940bb6d761b0d11ee7189 .github/codeql/codeql-config.yml | sha256sum --check --status
          printf '%s  %s\n' 71f79094b185fe90402f6e0d982e58b093d593bc1e54052816ba2583be1b77be .github/scripts/codeql_pr55_diagnostic.py | sha256sum --check --status
          test ! -e "$RUNNER_TEMP/pr55-codeql-database"
          test ! -e "$RUNNER_TEMP/pr55-codeql-results"

      - name: Install unchanged diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common cmake ninja-build libmariadb-dev-compat libluajit-5.1-dev libzmq3-dev zlib1g-dev libssl-dev binutils-dev libzstd-dev libdwarf-dev

      - name: Obtain digest-pinned official C++ bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/codeql-bundle-cpp-2.27.3.tar.zst"
          test ! -e "$bundle"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 300 --max-filesize 165281573 --output "$bundle" https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-cpp-linux64.tar.zst
          test "$(stat -c %s "$bundle")" = 165281573
          printf '%s  %s\n' 5ee1dca3f98dd46788c0a719f5d8b6da625b0722bf1aba28655ab880da81dc73 "$bundle" | sha256sum --check --status

      - name: Initialize controlled diagnostic
        id: diagnostic-init
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          tools: ${{ runner.temp }}/codeql-bundle-cpp-2.27.3.tar.zst
          languages: cpp
          build-mode: none
          db-location: ${{ runner.temp }}/pr55-codeql-database
          trap-caching: false
          debug: false
          config-file: ./.github/codeql/codeql-config.yml

      - name: Verify actual CLI and effective configuration
        env:
          CLI_VERSION: ${{ steps.diagnostic-init.outputs.codeql-version }}
        run: |
          test "$CLI_VERSION" = 2.27.3
          python3 -I .github/scripts/codeql_pr55_diagnostic.py cli

      - name: Analyze without publishing diagnostic data
        id: diagnostic-analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          upload: never
          upload-database: false
          category: mochirii-pr55-controlled-cpp-${{ matrix.mode }}
          output: ${{ runner.temp }}/pr55-codeql-results

      - name: Apply unchanged source exclusions
        uses: zbazztian/filter-sarif@30183a0a595e8a890f1624ebba3788ce5b58711b
        with:
          patterns: |
            -ext/**/*
            -build/**/*
          input: ${{ steps.diagnostic-analysis.outputs.sarif-output }}/cpp.sarif
          output: ${{ steps.diagnostic-analysis.outputs.sarif-output }}/cpp.sarif

      - name: Verify execution and emit bounded fingerprints only
        env:
          SARIF_DIRECTORY: ${{ steps.diagnostic-analysis.outputs.sarif-output }}
          SARIF_ID: ${{ steps.diagnostic-analysis.outputs.sarif-id }}
        run: |
          test -z "$SARIF_ID"
          python3 -I .github/scripts/codeql_pr55_diagnostic.py summary

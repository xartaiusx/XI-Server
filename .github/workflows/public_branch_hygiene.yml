name: Public Branch Hygiene

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  public_hygiene:
    name: Public branch hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify public repository boundaries
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          for path in local .lsb-secrets .lsb-local-client.env backups docker-compose.override.yml; do
              if [[ -e "$path" ]]; then
                  echo "::error::Private runtime path must not be present in the public repository: $path"
                  fail=1
              fi
          done

          if git ls-files | grep -Ev '^(log/\.gitkeep|sql/backups/\.gitignore)$' | grep -E '(^|/)(logs?|screenshots?|captures?|backups?|dumps?)(/|$)|\.(bak|backup|dump|sql\.gz|7z|zip|rar)$'; then
              echo "::error::Runtime logs, screenshots, backups, dumps, or mod archives must stay out of git"
              fail=1
          fi

          marker_regex='Twinkle''Toes|xArty''Zx|BEGIN[[:space:]]+(RSA[[:space:]]+|OPENSSH[[:space:]]+|EC[[:space:]]+)?PRIVATE[[:space:]]+KEY'
          if git grep -n -I -E "$marker_regex" -- \
              README.md AGENTS.md CONTRIBUTING.md SECURITY.md .github documentation scripts sql src settings modules tools ':!.github/workflows/public_branch_hygiene.yml'; then
              echo "::error::Secret or private account marker found in public repository content"
              fail=1
          fi

          stale_regex='retail-inspired/enhancements|LandSandBoat/server/blob/base|codex/server-wide|branch=base|/blob/base|^[[:space:]]*-[[:space:]]*base$'
          if grep -RInE --exclude='public_branch_hygiene.yml' "$stale_regex" README.md AGENTS.md CONTRIBUTING.md SECURITY.md .github documentation scripts settings tools modules; then
              echo "::error::Stale public branch or removed bot-system reference found"
              fail=1
          fi

          if grep -nE '^[[:space:]]*publish:[[:space:]]*true' .github/workflows/build.yml; then
              echo "::error::Normal validation build must not publish Docker images"
              fail=1
          fi

          if awk '/^jobs:/{ exit } /^[[:space:]]{2}push:/{ print; found=1 } END { exit found ? 0 : 1 }' .github/workflows/publish_meshes.yml; then
              echo "::error::Mesh image publishing must remain manually gated"
              fail=1
          fi

          exit "$fail"
